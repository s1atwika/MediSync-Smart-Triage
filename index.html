<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSync - Smart Patient Triage</title>
    <style>
        :root {
            --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --primary: #38bdf8;
            --high: #ef4444; --moderate: #f59e0b; --low: #10b981; --pending: #64748b;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; }
        .container { max-width: 1100px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #334155; padding-bottom: 20px; }
        .header h1 { margin: 0; color: var(--primary); font-size: 28px; }
        .header p { margin: 5px 0 0 0; color: #94a3b8; }
        button { background-color: var(--primary); color: #0f172a; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        button:hover { background-color: #0ea5e9; transform: translateY(-2px); }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 15px 25px; border-radius: 8px; border-left: 4px solid var(--primary); flex: 1; }
        .stat-card h3 { margin: 0 0 5px 0; font-size: 14px; color: #94a3b8; text-transform: uppercase; }
        .stat-card p { margin: 0; font-size: 24px; font-weight: bold; }
        .table-container { background: var(--card-bg); border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #334155; }
        th { background-color: #0f172a; color: #cbd5e1; font-weight: 600; text-transform: uppercase; font-size: 12px; }
        tr:hover { background-color: #334155; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .HIGH { background-color: rgba(239, 68, 68, 0.2); color: var(--high); border: 1px solid var(--high); }
        .MODERATE { background-color: rgba(245, 158, 11, 0.2); color: var(--moderate); border: 1px solid var(--moderate); }
        .LOW { background-color: rgba(16, 185, 129, 0.2); color: var(--low); border: 1px solid var(--low); }
        .PENDING { background-color: rgba(100, 116, 139, 0.2); color: var(--pending); border: 1px solid var(--pending); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>MediSync Hospital Dashboard</h1>
                <p>Agentic AI Triage & Risk Analyzer (Java OOP Project)</p>
            </div>
            <button onclick="runTriage()">⚡ Run AI Triage Engine</button>
        </div>
        <div class="stats">
            <div class="stat-card"><h3>Total Patients</h3><p id="total-count">0</p></div>
            <div class="stat-card"><h3>High Risk</h3><p id="high-count" style="color: var(--high);">0</p></div>
            <div class="stat-card"><h3>System Status</h3><p id="sys-status" style="color: var(--pending);">Awaiting Triage</p></div>
        </div>
        <div class="table-container">
            <table id="patientTable">
                <thead>
                    <tr><th>ID</th><th>Patient Name</th><th>BP (Sys)</th><th>Glucose</th><th>Risk Level</th><th>Assigned Department</th></tr>
                </thead>
                <tbody><!-- Data loads here --></tbody>
            </table>
        </div>
    </div>

    <script>
        // Generate 2000 mock patients
        let patients = [];
        for (let i = 1; i <= 2000; i++) {
            patients.push({
                id: i,
                name: "P_" + i,
                bp: Math.floor(Math.random() * 100) + 90, // Random BP 90-190
                sugar: Math.floor(Math.random() * 140) + 70, // Random Sugar 70-210
                risk: "PENDING",
                dept: "PENDING"
            });
        }

        function renderTable() {
            const tbody = document.querySelector('#patientTable tbody');
            tbody.innerHTML = '';
            let highCount = 0;

            patients.forEach(p => { if(p.risk === "HIGH") highCount++; });

            // Display only the top 15 patients (to prevent browser lag)
            const displayList = patients.slice(0, 15);

            displayList.forEach(p => {
                let row = `<tr>
                    <td>${p.id}</td>
                    <td style="font-weight: bold;">${p.name}</td>
                    <td>${p.bp}</td>
                    <td>${p.sugar}</td>
                    <td><span class="badge ${p.risk}">${p.risk}</span></td>
                    <td>${p.dept}</td>
                </tr>`;
                tbody.innerHTML += row;
            });

            document.getElementById('total-count').innerText = patients.length;
            document.getElementById('high-count').innerText = highCount;
        }

        function runTriage() {
            document.getElementById('sys-status').innerText = "Processing...";
            document.getElementById('sys-status').style.color = "var(--primary)";

            setTimeout(() => {
                patients.forEach(p => {
                    if (p.risk === "PENDING") {
                        if (p.bp > 135 || p.sugar < 100) {
                            if (p.bp > 140) p.risk = "HIGH";
                            else if (p.bp > 120) p.risk = "MODERATE";
                            else p.risk = "LOW";
                            p.dept = "CARDIOLOGY";
                        } else {
                            if (p.sugar > 140) p.risk = "HIGH";
                            else if (p.sugar > 100) p.risk = "MODERATE";
                            else p.risk = "LOW";
                            p.dept = "ENDOCRINOLOGY";
                        }
                    }
                });
                
                // Sort by risk priority
                patients.sort((a, b) => {
                    const priority = { "HIGH": 1, "MODERATE": 2, "LOW": 3, "PENDING": 4 };
                    return priority[a.risk] - priority[b.risk];
                });

                document.getElementById('sys-status').innerText = "Triage Complete ✅";
                document.getElementById('sys-status').style.color = "var(--low)";
                renderTable();
            }, 500); 
        }

        // Initial load
        renderTable();
    </script>
</body>
</html>
